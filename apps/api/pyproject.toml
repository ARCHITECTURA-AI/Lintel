[project]
name = "lintel-api"
version = "0.1.0"
description = "Lintel cloud API: fact ledger, drafting, approvals, audit and the job queue."
requires-python = ">=3.12"
dependencies = [
  "lintel-schemas",
  "lintel-trust",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "httpx>=0.27",
  "anthropic>=0.70",
  "fpdf2>=2.8",
  "pywebpush>=2.0",
]

[project.scripts]
lintel-api = "lintel_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintel_api"]
