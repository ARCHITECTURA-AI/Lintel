[project]
name = "lintel-lab"
version = "0.1.0"
description = "Lintel Lab: a local test site with Greenhouse, Lever and Ashby skins and every awkward case."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.12", "jinja2>=3.1"]

[project.scripts]
lintel-lab = "lintel_lab.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintel_lab"]
