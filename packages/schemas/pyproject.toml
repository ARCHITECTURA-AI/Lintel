[project]
name = "lintel-schemas"
version = "0.1.0"
description = "Pydantic models shared by the Lintel API, Local Runner and evals, with generated TypeScript types."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.scripts]
lintel-gen-ts = "lintel_schemas.gen_ts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintel_schemas"]
