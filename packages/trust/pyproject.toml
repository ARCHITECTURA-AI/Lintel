[project]
name = "lintel-trust"
version = "0.1.0"
description = "Lintel trust engine: canonical payload hashing, approval signing, value normalization and the claim check."
requires-python = ">=3.12"
dependencies = ["lintel-schemas", "cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintel_trust"]
