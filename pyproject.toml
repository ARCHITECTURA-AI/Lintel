[project]
name = "lintel-workspace"
version = "0.1.0"
description = "Lintel: the supervised job-application agent. The agent prepares, you sign off."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/schemas",
  "packages/trust",
  "apps/api",
  "apps/runner",
  "lab",
  "evals",
]

[tool.uv.sources]
lintel-schemas = { workspace = true }
lintel-trust = { workspace = true }
lintel-api = { workspace = true }
lintel-runner = { workspace = true }
lintel-lab = { workspace = true }
lintel-evals = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["packages/trust/tests", "packages/schemas/tests", "apps/api/tests", "apps/runner/tests", "evals/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
